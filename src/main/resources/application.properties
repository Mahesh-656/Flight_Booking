spring.application.name=FlightBooking

spring.datasource.url= jdbc:postgresql://localhost:5432/flight
spring.datasource.username=postgres
spring.datasource.password=mahi

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
server.port=8081

logging.level.org.flightbooking.aop=DEBUG
logging.file.name=logs/flightbooking.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n